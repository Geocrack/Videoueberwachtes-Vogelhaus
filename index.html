<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vogelhaus</title>
</head>
<body>
    <h1>Videoüberwachtes Vogelhaus</h1>

    <h2>Live Stream</h2>
    <img id="live-stream" alt="Loading live stream..." style="max-width: 100%;">

    <h2>Recording</h2>
    <button id="start-recording">Start recording</button>
    <button id="stop-recording">Stop recording</button>
    <p id="recording-status"></p>

    <h2>Videos</h2>
    <ul id="video-list"></ul>

    <script>
        // The camera this page shows. Make this switchable
        // (e.g. via URL parameter) once there are more birdhouses.
        const CAMERA_ID = "vogelhaus-0";

        const image = document.getElementById("live-stream");
        const statusText = document.getElementById("recording-status");
        const videoList = document.getElementById("video-list");

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${protocol}//${location.host}/ws/live/${CAMERA_ID}`);

        socket.onmessage = (message) => {
            const imageUrl = URL.createObjectURL(message.data);
            image.onload = () => URL.revokeObjectURL(imageUrl);
            image.src = imageUrl;
        };

        document.getElementById("start-recording").onclick = async () => {
            const response = await fetch(`/api/cameras/${CAMERA_ID}/recording/start`, { method: "POST" });
            const data = await response.json();
            statusText.textContent = response.ok ? "Recording..." : data.error;
        };

        document.getElementById("stop-recording").onclick = async () => {
            const response = await fetch(`/api/cameras/${CAMERA_ID}/recording/stop`, { method: "POST" });
            const data = await response.json();
            statusText.textContent = response.ok ? `Saved: ${data.video}` : data.error;
            loadVideos();
        };

        async function loadVideos() {
            const response = await fetch(`/api/cameras/${CAMERA_ID}/videos`);
            const data = await response.json();

            videoList.innerHTML = "";
            for (const video of data.videos) {
                const item = document.createElement("li");
                const link = document.createElement("a");
                link.href = `/api/cameras/${CAMERA_ID}/videos/${video}`;
                link.textContent = video;
                item.appendChild(link);
                videoList.appendChild(item);
            }
        }

        loadVideos();
    </script>
</body>
</html>
